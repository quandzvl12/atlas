name: Build Atlas Kernel

on:
  push:
    branches: [ master, compat-23.2, apatch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        timeout-minutes: 8
        run: |
          # Mirror azure cua runner hay loi DNS -> doi mirror, timeout ngan, khong de treo
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt || true
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get update $APT_OPTS || true
          sudo apt-get install -y --no-install-recommends $APT_OPTS \
            build-essential \
            bison \
            flex \
            libncurses5-dev \
            libssl-dev \
            bc \
            python3 \
            libelf-dev \
            ccache \
            zip \
            device-tree-compiler \
            libfdt-dev

      - name: Download AOSP Clang
        timeout-minutes: 15
        run: |
          mkdir -p clang-r547379
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang-r547379
          chmod -R +x clang-r547379/bin
          rm -f clang.tar.gz

      - name: Build kernel
        run: |
          export PATH="$(pwd)/clang-r547379/bin:${PATH}"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          mkdir out

          make ARCH=arm64 O=out CC=clang exynos850-a21snsxx_defconfig

          # Tat cac tuy chon debug ton CPU (an toan). Bo comment dong cuoi neu muon tat log cam ung.
          bash scripts/config --file out/.config -d KFENCE -d DEBUG_ATOMIC_SLEEP -d LTO_CLANG -d THINLTO
          # bash scripts/config --file out/.config -d SEC_DEBUG_TSP_LOG -d TOUCHSCREEN_HIMAX_DEBUG
          make ARCH=arm64 O=out CC=clang olddefconfig
          grep -E "CONFIG_(KFENCE|DEBUG_ATOMIC_SLEEP|LTO_CLANG|THINLTO)[= ]" out/.config || true
          if grep -qE '^CONFIG_(LTO_CLANG|THINLTO)=y$' out/.config; then
            echo "ERROR: LTO or ThinLTO is still enabled"
            exit 1
          fi

          # Chi toi uu lich xep lenh cho A55, khong doi tap lenh
          make ARCH=arm64 O=out CC=clang KCFLAGS="-mtune=cortex-a55" -j$(nproc)

      - name: Build dtb
        run: |
          dtc -I dts -O dtb -o raw.dtb arch/arm64/boot/dts/exynos/exynos3830.dts

          # Thu nhanh main truoc, roi master (AOSP da doi ten nhanh)
          for BR in main master; do
            curl -sL --retry 5 --retry-delay 5 --retry-connrefused -f \
              "https://android.googlesource.com/platform/prebuilts/misc/+/${BR}/linux-x86/libufdt/mkdtimg?format=TEXT" \
              -o mkdtimg.b64 || continue
            base64 -d mkdtimg.b64 > mkdtimg 2>/dev/null || true
            [ -s mkdtimg ] && break
          done
          rm -f mkdtimg.b64

          if [ ! -s mkdtimg ]; then
            echo "mkdtimg download/decode failed - resulting file is empty, aborting"
            exit 1
          fi

          chmod +x mkdtimg
          ./mkdtimg create dtb --page_size=2048 --custom1=0xff000000 raw.dtb
          echo "dtb size: $(du -h dtb | cut -f1)"

      - name: Verify build
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "Kernel Image not found!"
            exit 1
          fi
          echo "Kernel Image size: $(du -h out/arch/arm64/boot/Image | cut -f1)"

      - name: Package flashable zip
        run: |
          BUILD_SHA=$(git rev-parse --short HEAD)
          git clone https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          git checkout db90e19
          cd ..
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp dtb AnyKernel3/dtb
          cp .github/anykernel.sh AnyKernel3/anykernel.sh

          cd AnyKernel3
          rm -f kernel/zImage
          chmod +x anykernel.sh

          zip -r9 "${GITHUB_WORKSPACE}/atlas-ultra.zip" * -x .git README.md *placeholder

          echo "BUILD_SHA=${BUILD_SHA}" >> "${GITHUB_ENV}"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.BUILD_SHA }}.zip
          path: atlas-ultra.zip
